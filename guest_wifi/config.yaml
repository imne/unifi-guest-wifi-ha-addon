# Home Assistant add-on: Unifi Guest Wi-Fi Voucher Generator in the sidebar, signed in by Home Assistant.
# Keep "version" the same as package.json.
name: Unifi Guest Wi-Fi Voucher Generator
version: "1.4.0"
slug: guest_wifi
description: Generate UniFi guest WiFi tokens (hotspot vouchers) for your guests
url: https://github.com/imne/unifi-guest-wifi-ha-addon
arch:
  - aarch64
  - amd64
init: false
ingress: true
# Lets the add-on listen for the guest_wifi_generate event and publish the result,
# so automations can create tokens
homeassistant_api: true
# For the dashboard card: the add-on copies it into Home Assistant's www folder
map:
  - type: homeassistant_config
    read_only: false
ingress_port: 8099
panel_icon: mdi:wifi-star
panel_title: Guest WiFi
# Every Home Assistant user sees the panel and can generate tokens; only administrators can
# change the router connection. The option admins_only restricts the add-on to administrators.
panel_admin: false
# Leave both empty to enter them in the app instead (it asks on first use).
options:
  router_address: ""
  api_key: ""
  verify_certificate: false
  dashboard_card: true
  create_script: true
  admins_only: false
schema:
  router_address: "str?"
  api_key: "password?"
  verify_certificate: bool
  dashboard_card: bool
  create_script: bool
  admins_only: bool
