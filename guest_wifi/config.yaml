# Home Assistant add-on: Guest WiFi Manager in the sidebar, signed in by Home Assistant.
# Keep "version" the same as package.json.
name: Guest WiFi Manager
version: "1.0.0"
slug: guest_wifi
description: Generate UniFi guest WiFi tokens (hotspot vouchers) for your guests
url: https://github.com/imne/unifi-guest-wifi-ha-addon
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:wifi-star
panel_title: Guest WiFi
# true = only Home Assistant administrators see the panel; false = every user
panel_admin: true
