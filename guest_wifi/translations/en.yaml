configuration:
  router_address:
    name: Router address
    description: >-
      Address of your UniFi console, for example 192.168.1.1. Leave this and the API key
      empty to enter them in the app instead.
  api_key:
    name: API key
    description: >-
      From UniFi Network → Settings → Control Plane → Integrations → Create API Key.
  verify_certificate:
    name: Verify the router's certificate
    description: >-
      Leave off for a console that uses its built-in self-signed certificate.
  dashboard_card:
    name: Install the dashboard card
    description: >-
      Copies the "Guest WiFi" card into Home Assistant's www folder and registers it, so it
      can be added to a dashboard.
  create_script:
    name: Create the token script
    description: >-
      Creates script.guest_wifi_generate_token if it does not exist. It lets users who are
      not administrators generate tokens from the dashboard card, and automations can call it.
  admins_only:
    name: Administrators only
    description: >-
      Only Home Assistant administrators can open Guest WiFi and generate tokens. Turns off
      the token script.
